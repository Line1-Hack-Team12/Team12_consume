# AI 서비스(backend/) 이미지를 Docker Hub 에 올리고, EC2 가 설정돼 있으면 거기서 `ai` 서비스만 갱신한다.
# 백엔드 레포의 deploy.yml 과 같은 흐름. 이 레포(Team12_consume)의 Settings → Secrets 에 넣을 것:
#   DOCKERHUB_USERNAME  Docker Hub 계정 (백엔드와 같은 계정. compose 가 ${DOCKERHUB_USERNAME}/line1thon-ai:latest 를 받음)
#   DOCKERHUB_TOKEN     Docker Hub access token
#   EC2_HOST            EC2 퍼블릭 주소 (없으면 이미지 푸시까지만 하고 배포 단계는 건너뜀)
#   EC2_SSH_KEY         ubuntu 사용자 개인키
# ANTHROPIC_API_KEY 는 여기 없다. EC2 의 ~/app/.env 에만 둔다 (compose 의 ai 서비스가 env_file 로 읽음).
name: Build AI image

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/ai-image.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AI image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/line1thon-ai:latest

      - name: Deploy ai service to EC2 via SSH
        if: ${{ secrets.EC2_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull ai
            docker compose up -d ai
            docker image prune -f
